# Cau hinh them vao postgresql.conf cua BAN PHUC HOI (thu muc rieng, chay song song cluster goc).
# Script 04_phuc_hoi_pitr.ps1 tu ghi doan nay; file nay chi de tham khao / nop kem.
# Ngoai ra can tao file rong recovery.signal trong thu muc du lieu cua ban phuc hoi.

port = 55492                       # 55493 neu phuc hoi theo thoi diem
archive_mode = off                 # khong ghi them WAL vao kho cua cluster goc

# Cach lay WAL tu kho ve (nguoc voi archive_command).
restore_command = 'copy "F:\\lab5\\wal_archive\\%f" "%p"'

# Chon MOT trong hai cach dat diem dung:
recovery_target_name = 'truoc_xoa_nham'          # theo ten moc tao bang pg_create_restore_point
# recovery_target_time = '2026-11-08 00:31:30+07' # theo thoi diem (lay tu clock_timestamp())

# Dung xong thi mo cho doc/ghi binh thuong.
recovery_target_action = 'promote'
