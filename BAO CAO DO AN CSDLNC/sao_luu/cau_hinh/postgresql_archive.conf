# Cau hinh them vao cuoi postgresql.conf cua cluster thu nghiem (cong 55491).
# Script 01_dung_cluster.ps1 tu ghi doan nay; file nay chi de tham khao / nop kem.
# Luu y: trong postgresql.conf, dau \ trong duong dan phai viet \\ (vi du F:\\lab5\\wal_archive).

port = 55491
listen_addresses = '127.0.0.1'
cluster_name = 'task5_lab'

# Bat luu tru WAL: moi file WAL day (hoac sau archive_timeout giay) duoc chep sang kho rieng.
# %p = duong dan file WAL, %f = ten file. Chi chep neu file chua ton tai (khong ghi de).
archive_mode = on
archive_command = 'if not exist "F:\\lab5\\wal_archive\\%f" copy "%p" "F:\\lab5\\wal_archive\\%f"'

# Ep chuyen sang file WAL moi sau toi da 60 giay -> gioi han RPO.
archive_timeout = 60

# Can cho sao luu gia tang (pg_basebackup --incremental).
summarize_wal = on

log_line_prefix = '%m [%p] '
logging_collector = off
